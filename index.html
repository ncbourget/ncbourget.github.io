<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nate Bourget</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="home-page">

  <div class="page-column">

    <div class="homepage-header">
      This is the true<br>
      homepage of<br>
      Nate Bourget
    </div>

    <div class="portrait">
      <img src="images/home.jpg" alt="Your portrait">
    </div>

    <div class="text-column">
      <div><a href="https://natebourget.com/">Portfolio</a></div>
      <div><a href="https://nervepilot.com/">Nervepilot</a></div>
      <div><a href="the-limit.html">The Limit</a></div>
      <div><a href="https://www.instagram.com/amazingliquidfire/">Social</a></div>
      <div><a href="https://4orm.harrhy.xyz/u/einhorn">4orm</a></div>
      <div><a href="#" class="updates-link" id="openUpdates">Updates</a></div>

      <div class="contact-info">
        info@nervepilot.com<br>
        tel. +1 (617) 750-4639<br>
        Text or Voicemail
      </div>
    </div>

  </div>

  <div class="updates-overlay" id="updatesOverlay">
    <div class="updates-window" id="updatesWindow">

      <div class="updates-marquee">
        <span>UPDATES! UPDATES! UPDATES! UPDATES! UPDATES! UPDATES!</span>
      </div>

      <div class="updates-content">

        <div class="update-entry">
          <h2>May 2026</h2>
          <p>
            First update goes here. This can be edited easily inside index.html.
          </p>
          <img src="images/example-update.jpg" alt="Update image">
        </div>

      </div>

    </div>
  </div>

  <script>
    const openUpdates = document.getElementById("openUpdates");
    const updatesOverlay = document.getElementById("updatesOverlay");
    const updatesWindow = document.getElementById("updatesWindow");

    openUpdates.addEventListener("click", function(event) {
      event.preventDefault();
      updatesOverlay.classList.add("active");
    });

    updatesOverlay.addEventListener("click", function() {
      updatesOverlay.classList.remove("active");
    });

    updatesWindow.addEventListener("click", function(event) {
      event.stopPropagation();
    });
  </script>

</body>
</html>
