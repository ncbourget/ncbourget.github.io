<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nate Bourget</title>

  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Helvetica, Arial, Courier, monospace;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Entire page constrained to image width */
    .page-column {
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .homepage-header {
      font-size: 12px;
      font-weight: normal;
      line-height: 1.3;
      margin-bottom: 48px;
      text-align: right;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .portrait {
      position: relative;
      top: -2vh;
      width: 120px;
    }

    .portrait img {
      width: 120px;
      height: 160px;
      object-fit: cover;
      border: none;
      border-radius: 0;
      display: block;
    }

    .text-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 12px;
      margin-top: 18px;
      width: 120px;
      text-align: right;
    }

    .text-column a,
    .homepage-header {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: all 0.1s ease;
    }

    .text-column a:hover,
    .homepage-header:hover {
      font-family: "Times New Roman", Times, serif;
      font-style: italic;
    }

    .contact-info {
      margin-top: 48px;
      color: #bfbfbf;
      font-family: Courier, monospace;
      font-size: 9px;
      line-height: 1.6;
      text-align: left;
      width: 120px;
    }
  </style>
</head>

<body>

  <div class="page-column">

    <div class="homepage-header">
      This is the true homepage of Nate Bourget
    </div>

    <div class="portrait">
      <img src="homepagepics/home.jpg" alt="Your portrait">
    </div>

    <div class="text-column">

      <div>
        <a href="https://natebourget.com/">Portfolio</a>
      </div>

      <div>
        <a href="https://nervepilot.com/">Nervepilot</a>
      </div>

      <div>
        <a href="the-limit.html">The Limit</a>
      </div>

      <div>
        <a href="https://www.instagram.com/amazingliquidfire/">Social</a>
      </div>

      <div>
        <a href="https://4orm.harrhy.xyz/u/einhorn">4orm</a>
      </div>

      <div class="contact-info">
        info@nervepilot.com<br>
        tel. +1 (617) 750-4639<br>
        Text or Voicemail
      </div>

    </div>

  </div>

</body>
</html>
