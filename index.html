<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* This only affects the portrait section */
    .portrait {
      position: relative;
      top: -10vh; /* moves just this image up slightly */
      text-align: center;
    }

    .portrait img {
      width: 120px;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid #fff;
    }

    /* Text column below */
    .text-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      font-family: Helvetica, Arial, Courier, monospace;
      margin-top: -6vh; /* adjust to move closer/farther from image */
      text-align: center;
    }

    .text-column div {
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="portrait">
    <img src="your-photo.jpg" alt="Your portrait">
  </div>

  <div class="text-column">
    <div>First line of text</div>
    <div>Second line of text</div>
    <div>Third line of text</div>
    <div>Fourth line of text</div>
    <div>Fifth line of text</div>
  </div>
</body>
</html>
